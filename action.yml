name: "Multi-CLI LLM PR Reviewer"
description: "AI PR review with automatic quota fallback across Kiro, Codex, and Agy CLI engines, maintainer gating, and Jules-style history."
author: "cakel"

inputs:
  github-token:
    description: "GitHub token for commenting and PR reviews"
    required: false
    default: "${{ github.token }}"
  engines:
    description: "Comma-separated list of CLI engines to attempt in order (kiro, codex, agy, claude)"
    required: false
    default: "kiro,codex,agy,claude"
  model:
    description: "Model override for CLI engines"
    required: false
    default: ""
  effort:
    description: "Reasoning effort (e.g. low, medium, high)"
    required: false
    default: "medium"
  state-file:
    description: "Custom path to persist last successful engine"
    required: false
    default: ""
  submit-review:
    description: "Whether to submit a formal request-changes review (default true; set false to delegate decision to workflow gate)"
    required: false
  post-comment:
    description: "Whether to post review comments directly to the PR (default true; set false when workflow handles posting)"
    required: false
    default: "true"
  output-file:
    description: "Path to write review comment markdown output"
    required: false
    default: ""
  summary-file:
    description: "Path to write signed machine review summary JSON output"
    required: false
    default: ""
  summary-key:
    description: "Pre-shared secret key for machine summary signing and verification"
    required: false
    default: ""
  diff-file:
    description: "Path to pre-verified diff file (overrides live git diff if provided)"
    required: false
    default: ""
  max-diff-bytes:
    description: "Diff size limit in UTF-8 bytes. Above it the review is skipped (decision=skipped_oversize, step succeeds) and a PR comment asks not to request more reviews"
    required: false
    default: "200000"

outputs:
  decision:
    description: "Review decision (approve, request_changes, fix_suggested, or skipped_oversize — not reviewed, never an approval)"
    value: "${{ steps.reviewer.outputs.decision }}"
  blocking:
    description: "Number of blocking findings (critical + major)"
    value: "${{ steps.reviewer.outputs.blocking }}"

runs:
  using: "composite"
  steps:
    - name: Run LLM Review Harness
      id: reviewer
      shell: bash
      env:
        PYTHONPATH: "${{ github.action_path }}:${{ env.PYTHONPATH }}"
        # cwd is the PR checkout: without this, `python3 -m` puts it first on sys.path, so a PR file such as
        # review_harness/ or json.py would run inside the reviewer (GH_TOKEN + CLI credentials). Python 3.11+.
        PYTHONSAFEPATH: "1"
        GH_TOKEN: "${{ inputs.github-token }}"
        GITHUB_TOKEN: "${{ inputs.github-token }}"
        PR_NUMBER: "${{ github.event.pull_request.number || github.event.issue.number }}"
        BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        PR_AUTHOR: "${{ github.event.pull_request.user.login || github.event.issue.user.login }}"
        COMMENT_BODY: "${{ github.event.comment.body }}"
      run: |
        python3 -m review_harness.main \
          --repo "${{ github.repository }}" \
          --pr "${PR_NUMBER}" \
          --base "${BASE_SHA}" \
          --head "${HEAD_SHA}" \
          --actor "${{ github.actor }}" \
          --pr-author "${PR_AUTHOR}" \
          --event-name "${{ github.event_name }}" \
          --comment-body "${COMMENT_BODY}" \
          --workspace "${{ github.workspace }}" \
          --engines "${{ inputs.engines }}" \
          --model "${{ inputs.model }}" \
          --effort "${{ inputs.effort }}" \
          --max-diff-bytes "${{ inputs.max-diff-bytes }}" \
          ${{ inputs.diff-file != '' && format('--diff-file {0}', inputs.diff-file) || '' }} \
          ${{ inputs.output-file != '' && format('--output-file {0}', inputs.output-file) || '' }} \
          ${{ inputs.summary-file != '' && format('--summary-file {0}', inputs.summary-file) || '' }} \
          ${{ inputs.summary-key != '' && format('--summary-key {0}', inputs.summary-key) || '' }} \
          ${{ inputs.post-comment == 'false' && '--no-post-comment' || '--post-comment' }} \
          ${{ inputs.submit-review == 'false' && '--no-submit-review' || '--submit-review' }} \
          ${{ inputs.state-file != '' && format('--state-file {0}', inputs.state-file) || '' }}
